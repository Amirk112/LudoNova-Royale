<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LudoNova Royale</title>
<style>
body {
  background: #17152b;
  color: white;
  text-align: center;
  font-family: Arial;
}
h1 { color: gold; }
.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  width: min(90vw, 360px);
  aspect-ratio: 1;
  margin: 25px auto;
  gap: 5px;
}
.home {
  display: grid;
  place-items: center;
  border: 4px solid white;
  border-radius: 12px;
  font-size: 25px;
}
.red {background:#e63946}
.green {background:#168b55}
.yellow {background:#e6bd20;color:black}
.blue {background:#2468d9}
.center {background:white;color:#17152b}
button {
  background: gold;
  border: none;
  border-radius: 12px;
  padding: 15px 30px;
  font-size: 20px;
  font-weight: bold;
}
#dice {font-size:50px;margin:20px}
</style>
</head>
<body>
<h1>🎲 LudoNova Royale</h1>
<div class="board">
<div class="home red">🔴 RED</div>
<div class="home green">🟢 GREEN</div>
<div class="home blue">🔵 BLUE</div>
<div class="home yellow">🟡 YELLOW</div>
<div class="home center">🏆</div>
<div class="home green">🟢 GREEN</div>
<div class="home blue">🔵 BLUE</div>
<div class="home yellow">🟡 YELLOW</div>
<div class="home red">🔴 RED</div>
</div>
<div id="dice">🎲</div>
<button onclick="roll()">ROLL DICE</button>
<p id="result">Welcome to LudoNova Royale!</p>
<script>
function roll(){
let n=Math.floor(Math.random()*6)+1;
document.getElementById("dice").innerText=n;
document.getElementById("result").innerText="You rolled "+n+"!";
}
</script>
</body>
</html>
